<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="GitPush Money — personal finance with an AI copilot">
  <defs>
    <radialGradient id="glowL" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="90%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#5EE7F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5EE7F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#5EE7F7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .draw { stroke-dasharray: 900; animation: draw 2.4s ease-out backwards; }
      .node { animation: pop .4s ease-out backwards; }
      .n1 { animation-delay: .5s } .n2 { animation-delay: 1s } .n3 { animation-delay: 1.5s } .n4 { animation-delay: 2s }
      @keyframes draw { from { stroke-dashoffset: 900 } }
      @keyframes pop { from { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .draw, .node { animation: none } }
    </style>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#0F0F13"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowL)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glowR)"/>

  <!-- Rising trend line, echoing the circuit nodes of the logo -->
  <path d="M800 300 L880 262 L950 276 L1030 200 L1110 214 L1230 96 L1230 360 L800 360 Z" fill="url(#area)"/>
  <path class="draw" d="M800 300 L880 262 L950 276 L1030 200 L1110 214 L1230 96" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0F0F13" stroke-width="4">
    <circle class="node n1" cx="880" cy="262" r="8" stroke="#A78BFA"/>
    <circle class="node n2" cx="1030" cy="200" r="8" stroke="#6366F1"/>
    <circle class="node n3" cx="1110" cy="214" r="8" stroke="#60A5FA"/>
    <circle class="node n4" cx="1230" cy="96" r="10" stroke="#5EE7F7"/>
  </g>

  <image x="88" y="92" width="176" height="176" href="data:image/webp;base64,"/>

  <g class="t">
    <text x="304" y="132" fill="#8B93FF" font-size="15" font-weight="700" letter-spacing="4">EXPENSE MANAGER</text>
    <text x="302" y="198" fill="#FFFFFF" font-size="66" font-weight="800" letter-spacing="-1.5">GitPush Money</text>
    <rect x="304" y="216" width="56" height="4" rx="2" fill="#F97316"/>
    <text x="304" y="254" fill="#B0B0B0" font-size="23">Personal finance with an AI copilot.</text>

    <g font-size="14" font-weight="600" fill="#D8DCFF">
      <rect x="304" y="276" width="122" height="30" rx="15" fill="#4F46E5" fill-opacity="0.18" stroke="#4F46E5" stroke-opacity="0.6"/>
      <text x="365" y="296" text-anchor="middle">Multi-currency</text>
      <rect x="436" y="276" width="78" height="30" rx="15" fill="#4F46E5" fill-opacity="0.18" stroke="#4F46E5" stroke-opacity="0.6"/>
      <text x="475" y="296" text-anchor="middle">AI chat</text>
      <rect x="524" y="276" width="88" height="30" rx="15" fill="#4F46E5" fill-opacity="0.18" stroke="#4F46E5" stroke-opacity="0.6"/>
      <text x="568" y="296" text-anchor="middle">Budgets</text>
      <rect x="622" y="276" width="58" height="30" rx="15" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.6"/>
      <text x="651" y="296" text-anchor="middle" fill="#FED7AA">PWA</text>
    </g>
  </g>
</svg>
